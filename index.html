<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Product preview card component</title>
  
</head>
<body>

  <div class="container">
    <div class="card">
      <picture>
        <source
                media="(max-width: 624px)"
                srcset="./images/image-product-mobile.jpg"
        >
        <img
                class="card__image"
                src="./images/image-product-desktop.jpg"
                alt="Gabrielle Essence Eau De Parfum"
        >
      </picture>
      <div class="card__content">
        <span class="card__category">Perfume</span>
        <h1 class="card__title">Gabrielle Essence Eau De Parfum</h1>
        <p class="card__description">
          A floral, solar and voluptuous interpretation composed by Olivier Polge,
          Perfumer-Creator for the House of CHANEL.
        </p>
        <div class="card__price">
          <p class="card__price-new">$149.99</p>
          <p class="card__price-old">$169.99</p>
        </div>
        <button class="card__button" type="button">
          <img src="./images/icon-cart.svg" alt="" class="card__button-icon">
          Add to Cart
        </button>
      </div>
    </div>
  </div>
</body>
</html>
